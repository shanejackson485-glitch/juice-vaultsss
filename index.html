<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juice WRLD Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f1115; color: white; font-family: 'Inter', sans-serif; }
        .card { background-color: #1a1d24; border: 1px solid #2a2e39; border-radius: 12px; }
        .badge { background-color: #f59e0b; color: black; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; }
    </style>
</head>
<body class="p-6">

    <!-- Top Bar: Song of the Hour -->
    <div class="card p-4 flex justify-between items-center mb-6">
        <div>
            <h2 class="text-xl font-bold">Song of the hour</h2>
            <p class="text-gray-400">Fast <span class="text-xs text-blue-400">DRFL</span> <span class="badge">Released</span></p>
        </div>
        <div class="text-right">
            <p class="text-sm text-gray-500">Next in 00:43</p>
        </div>
    </div>

    <!-- Main Grid -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Left Column (Latest) -->
        <div class="col-span-2 space-y-6">
            <div class="card p-4">
                <h3 class="text-lg font-bold mb-4">Latest</h3>
                <div id="latest-list" class="space-y-4">
                    <!-- Songs will be injected here by JS -->
                </div>
            </div>
        </div>

        <!-- Right Column (Top 5 / Live) -->
        <div class="space-y-6">
            <div class="card p-4">
                <h3 class="text-lg font-bold mb-4">Top 5 this week</h3>
                <!-- List goes here -->
            </div>
            <div class="card p-4">
                <h3 class="text-lg font-bold mb-4">Live now</h3>
                <p class="text-green-400">11 people listening right now</p>
            </div>
        </div>

    </div>

    <script>
        // Fetch from YOUR API on Render
        const API_URL = "https://your-api.onrender.com/latest";

        async function loadLatestSongs() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                const container = document.getElementById('latest-list');
                container.innerHTML = ''; // Clear loading text

                data.songs.forEach(song => {
                    // Create a song card for each item
                    const songHTML = `
                        <div class="flex items-center gap-4 border-b border-gray-700 pb-2">
                            <img src="${song.cover}" class="w-12 h-12 rounded">
                            <div>
                                <p class="font-bold">${song.title}</p>
                                <p class="text-sm text-gray-400">${song.era} • ${song.length}</p>
                            </div>
                        </div>
                    `;
                    container.innerHTML += songHTML;
                });
            } catch (e) {
                console.error("Error fetching songs:", e);
            }
        }

        // Run when page loads
        loadLatestSongs();
    </script>
</body>
</html>
