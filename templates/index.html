<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { background-color: #0d0f12; color: white; font-family: 'Inter', sans-serif; }
        .card { background: #15171e; border-radius: 16px; border: 1px solid #2a2e39; }
        .purple-btn { background: #8b5cf6; color: white; transition: 0.2s; }
        .purple-btn:hover { background: #7c3aed; }
        .red-btn { background: #ef4444; color: white; transition: 0.2s; }
        .red-btn:hover { background: #dc2626; }
        .status-dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; }
        .progress-bar { height: 8px; border-radius: 4px; background: #2a2e39; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
    </style>
</head>
<body class="p-6">

    <!-- Top Nav -->
    <div class="max-w-5xl mx-auto flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
        <h1 class="text-2xl font-extrabold flex items-center gap-2">🤖 Bot Dashboard</h1>
        <div class="flex gap-4 text-sm font-semibold">
            <span class="text-purple-400">Overview</span>
        </div>
    </div>

    <!-- Main Content -->
    <div class="max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Server Stats (Left) -->
        <div class="col-span-2 space-y-6">
            <div class="card p-6">
                <h2 class="text-xl font-bold mb-4">Server Status</h2>
                <div class="flex items-center gap-3 mb-6">
                    <div id="status-dot" class="status-dot bg-yellow-500"></div>
                    <span id="status-text" class="text-yellow-500 font-bold">Checking...</span>
                </div>
                
                <div class="space-y-4">
                    <div>
                        <div class="flex justify-between text-sm mb-1"><span class="text-gray-400">CPU</span> <span id="cpu-text">0%</span></div>
                        <div class="progress-bar"><div id="cpu-bar" class="progress-fill bg-blue-500" style="width: 0%"></div></div>
                    </div>
                    <div>
                        <div class="flex justify-between text-sm mb-1"><span class="text-gray-400">RAM</span> <span id="ram-text">0%</span></div>
                        <div class="progress-bar"><div id="ram-bar" class="progress-fill bg-purple-500" style="width: 0%"></div></div>
                    </div>
                    <div>
                        <div class="flex justify-between text-sm mb-1"><span class="text-gray-400">Disk</span> <span id="disk-text">0%</span></div>
                        <div class="progress-bar"><div id="disk-bar" class="progress-fill bg-green-500" style="width: 0%"></div></div>
                    </div>
                </div>
            </div>

            <!-- GitHub Integration -->
            <div class="card p-6">
                <h2 class="text-xl font-bold mb-4">GitHub Integration</h2>
                <p class="text-gray-400 text-sm mb-4">Pull the latest code from your repository to update the bot.</p>
                
                <div id="github-status" class="mb-4 text-sm font-bold text-yellow-400">Checking connection...</div>
                
                <button onclick="pullCode()" class="purple-btn px-6 py-3 rounded-lg font-bold w-full">Pull Latest Code</button>
            </div>
        </div>

        <!-- Quick Actions (Right) -->
        <div class="space-y-6">
            <div class="card p-6">
                <h2 class="text-lg font-bold mb-4">Bot Controls</h2>
                <button onclick="restartBot()" class="purple-btn px-4 py-3 rounded-lg font-bold w-full mb-3">Restart Bot</button>
                <button onclick="stopBot()" class="red-btn px-4 py-3 rounded-lg font-bold w-full">Stop Bot</button>
            </div>
        </div>
    </div>

    <script>
        // Live Stats
        async function fetchStats() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();
                
                // Update Bars
                document.getElementById('cpu-text').innerText = data.cpu + "%";
                document.getElementById('cpu-bar').style.width = data.cpu + "%";
                
                document.getElementById('ram-text').innerText = data.ram + "%";
                document.getElementById('ram-bar').style.width = data.ram + "%";
                
                document.getElementById('disk-text').innerText = data.disk + "%";
                document.getElementById('disk-bar').style.width = data.disk + "%";

                // Update Bot Status
                const dot = document.getElementById('status-dot');
                const text = document.getElementById('status-text');
                
                if (data.bot_running) {
                    dot.className = "status-dot bg-green-500";
                    text.innerText = "Bot is Online";
                    text.className = "text-green-500 font-bold";
                } else {
                    dot.className = "status-dot bg-red-500";
                    text.innerText = "Bot is Offline";
                    text.className = "text-red-500 font-bold";
                }
            } catch (e) {
                console.error("Failed to fetch stats", e);
            }
        }

        // Bot Controls
        async function restartBot() {
            await fetch('/api/bot/restart', { method: 'POST' });
            alert("Restarting Bot...");
            fetchStats();
        }

        async function stopBot() {
            await fetch('/api/bot/stop', { method: 'POST' });
            alert("Stopping Bot...");
            fetchStats();
        }

        // GitHub
        async function checkGithub() {
            const res = await fetch('/api/github/status');
            const data = await res.json();
            const statusEl = document.getElementById('github-status');
            
            if (data.status === 'Connected') {
                statusEl.innerText = `Connected to ${data.user}/${data.repo}`;
                statusEl.className = "mb-4 text-sm font-bold text-green-400";
            } else {
                statusEl.innerText = "Error: Check GitHub Token in dashboard.py";
                statusEl.className = "mb-4 text-sm font-bold text-red-400";
            }
        }

        async function pullCode() {
            const res = await fetch('/api/github/pull', { method: 'POST' });
            const data = await res.json();
            alert(data.message);
        }

        // Run on Load
        fetchStats();
        checkGithub();
        
        // Update every 3 seconds
        setInterval(fetchStats, 3000);
    </script>
</body>
</html>
